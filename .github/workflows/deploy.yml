# Intentionally no deploy workflow.
# blog-app is a public source repo. Production builds are pulled and deployed
# by wolverine (.github/workflows/deploy.yml) using wolverine's GitHub secrets.
#
# To ship blog changes: merge to blog-app main, then push/redeploy wolverine master
# (or run the wolverine "Deploy to AWS" workflow manually).
name: No-op (deploy via wolverine)

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "blog-app is not deployed from this repo."
          echo "Deploy happens from lcborn4/wolverine on push to master."
